[project]
name = "neova"
version = "0.1.0"
description = "Néova Télécom customer-relations agent : LangGraph + FastAPI"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "openai>=1.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pymupdf>=1.24",
  "rank-bm25>=0.2.2",
  "snowballstemmer>=2.2",
  "numpy>=1.26",
  "tenacity>=8.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "langfuse>=3.0",
  "tzdata>=2026.4",
]

[project.scripts]
neova = "neova.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neova"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
